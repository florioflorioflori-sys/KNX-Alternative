name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build KnxAlternative.sln -c Release
      - name: Test
        run: dotnet test tests/KnxAlternative.Tests -c Release --no-build
      - name: Publish Windows app
        run: dotnet publish src/KnxAlternative.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/KnxAlternative
      - name: Publish command line tool
        run: dotnet publish src/KnxAlternative.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/KnxAlternative
      - uses: actions/upload-artifact@v4
        with:
          name: KnxAlternative-win-x64
          path: publish/KnxAlternative
